name: Add a project
description: A TON or Telegram project that is missing
title: "Add: "
labels: [new project]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: What it is
      placeholder: Wallet, game, DEX...
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Any of Telegram channel, bot, X, site, GitHub. One per line.
    validations:
      required: true
  - type: input
    id: launched
    attributes:
      label: Launched
      description: When it started or came to TON, if you know, and where that is written.
