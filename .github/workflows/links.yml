name: links

# Weekly full link check: refreshes reports/link-check.md and commits it if anything changed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_links.py
      - run: python3 scripts/build_readme.py
      - name: Commit report
        run: |
          git config user.name "gram-ecosystem bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/link-check.md README.md
          git diff --cached --quiet || git commit -m "link check: refresh report"
          git push
